services:
  # FinishX Production Web Service (Express API)
  - type: web
    name: finishx-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start:prod
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: APP_BASE_URL
        value: https://finishx-api.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "FinishX <no-reply@finishx.app>"
      - key: LOG_LEVEL
        value: info

  # FinishX Scheduled Background Job Runner (Render Cron Job)
  - type: cron
    name: finishx-scheduler
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run jobs:run
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
